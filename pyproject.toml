[project]
name = "anki-helpers"
version = "0.1.0"
description = "A CLI tool to help with Anki flashcards"
authors = [{ name = "davojta" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.1.8",
    "requests>=2.31.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
anki-helpers = "anki_helpers.cli:cli"

[dependency-groups]
dev = [
    "pre-commit>=3.6.0",
    "pyright>=1.1.400",
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.0",
    "types-requests>=2.32.0.20250328",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anki_helpers"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D", "SIM", "RUF", "PT"]
pycodestyle.max-line-length = 120
pydocstyle.convention = "google"

[tool.ruff.format]
exclude = ["*.md"]  # keep hand-aligned snippets in docs

[tool.pyright]
include = ["src", "tests", "scripts"]
strict = ["src"]
typeCheckingMode = "standard"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = ["e2e: runs the installed CLI against the stub AnkiConnect"]
