name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: make check
        run: make check

      - name: Generic pre-commit hooks
        env:
          SKIP: ruff-check,ruff-format,pyright
        run: uv run pre-commit run --all-files
